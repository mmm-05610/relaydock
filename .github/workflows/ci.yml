name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      # 内嵌控制台占位校验通过后，用 web job 同版本源码生成真实 dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 生成内嵌控制台 dist
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf ../gateway/internal/console/dist
          mkdir -p ../gateway/internal/console
          cp -r dist ../gateway/internal/console/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "需要 gofmt: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: build
        run: CGO_ENABLED=0 go build -ldflags "-X gateway/internal/gateway.Version=${GITHUB_REF_NAME}" -o /tmp/gateway ./cmd/gateway
