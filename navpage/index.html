<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫猫王国</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --surface: rgba(255, 255, 255, 0.6);
        --surface-hover: rgba(255, 255, 255, 0.72);
        --border: rgba(255, 255, 255, 0.5);
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #5e5ce6;
        --online: #34c759;
        --offline: #ff3b30;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 64px 24px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ---- 背景光斑 ---- */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }
      .blob-a {
        background: #dbeafe;
        width: 520px;
        height: 520px;
        top: -160px;
        left: -120px;
      }
      .blob-b {
        background: #ede9fe;
        width: 640px;
        height: 640px;
        top: 120px;
        right: -220px;
      }
      .blob-c {
        background: #fce7f3;
        width: 440px;
        height: 440px;
        bottom: -140px;
        left: 28%;
      }

      .wrap {
        width: 100%;
        max-width: 640px;
        position: relative;
        z-index: 1;
      }

      /* ---- 品牌 ---- */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 40px;
      }
      .brand svg {
        width: 20px;
        height: 20px;
        color: var(--text);
      }
      .brand .name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* ---- 时间块 ---- */
      .clock-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-variant-numeric: tabular-nums;
      }
      .clock {
        font-size: 76px;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .seconds {
        font-size: 28px;
        font-weight: 300;
        color: var(--muted);
      }
      .date {
        margin-top: 14px;
        font-size: 15px;
        color: var(--muted);
        font-weight: 400;
      }
      .sub {
        margin-top: 28px;
        font-size: 15px;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ---- 分区 ---- */
      .section {
        margin-top: 48px;
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.06em;
        margin-bottom: 14px;
      }
      .section-title svg {
        width: 14px;
        height: 14px;
        color: var(--muted);
      }

      /* ---- 玻璃卡片 ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      a.card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        backdrop-filter: blur(20px) saturate(1.8);
        -webkit-backdrop-filter: blur(20px) saturate(1.8);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        transition:
          background 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      a.card:hover {
        background: var(--surface-hover);
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
      }
      a.card.placeholder {
        opacity: 0.75;
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .card-top svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .card-top .t {
        font-size: 15px;
        font-weight: 550;
        letter-spacing: -0.01em;
      }
      .status {
        margin-left: auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c7c7cc;
        flex-shrink: 0;
        transition: background 0.3s ease;
      }
      .status.online {
        background: var(--online);
        box-shadow: 0 0 8px rgba(52, 199, 89, 0.5);
      }
      .status.offline {
        background: var(--offline);
        box-shadow: 0 0 8px rgba(255, 59, 48, 0.4);
      }
      .card .d {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.55;
      }
      .card .arrow {
        margin-top: 12px;
        font-size: 13px;
        color: var(--accent);
        font-weight: 500;
        opacity: 0;
        transform: translateX(-4px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      a.card:hover .arrow {
        opacity: 1;
        transform: translateX(0);
      }
      .card .soon {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      footer {
        margin-top: 56px;
        font-size: 13px;
        color: var(--muted);
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>

    <div class="wrap">
      <header>
        <div class="brand">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 2a3 3 0 0 0-3 3v1.5a3 3 0 0 0 1.5 2.6l-2 1.2A3 3 0 0 0 7 13v7a1 1 0 0 0 2 0v-2h6v2a1 1 0 0 0 2 0v-7a3 3 0 0 0-1.5-2.6l-2-1.2A3 3 0 0 0 15 6.5V5a3 3 0 0 0-3-3z"
            />
            <circle cx="9.5" cy="6" r="0.6" fill="currentColor" stroke="none" />
            <circle
              cx="14.5"
              cy="6"
              r="0.6"
              fill="currentColor"
              stroke="none"
            />
          </svg>
          <span class="name">猫猫王国</span>
        </div>

        <div class="clock-row">
          <span class="clock" id="clock">00:00</span>
          <span class="seconds" id="seconds">00</span>
        </div>
        <div class="date" id="date"></div>
        <p class="sub">个人门户 · 内容与服务的统一入口</p>
      </header>

      <!-- 公开区 -->
      <section class="section">
        <div class="section-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M2 12h20" />
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          探索
        </div>
        <div class="grid">
          <a class="card placeholder" href="#">
            <div class="card-top">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path
                  d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
                />
              </svg>
              <span class="t">博客</span>
            </div>
            <div class="d">记录与思考</div>
            <span class="soon">即将上线</span>
          </a>
          <a class="card" href="/docs">
            <div class="card-top">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path
                  d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                />
              </svg>
              <span class="t">文档</span>
            </div>
            <div class="d">系统级 + 项目级文档库</div>
            <span class="arrow">打开 →</span>
          </a>
          <a class="card placeholder" href="#">
            <div class="card-top">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span class="t">简历</span>
            </div>
            <div class="d">个人经历</div>
            <span class="soon">即将上线</span>
          </a>
        </div>
      </section>

      <!-- 私有区 -->
      <section class="section">
        <div class="section-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          服务
        </div>
        <div class="grid">
          <a class="card" href="/panel">
            <div class="card-top">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"
                />
                <path
                  d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"
                />
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
              </svg>
              <span class="t">网关面板</span>
              <span class="status" data-url="/panel"></span>
            </div>
            <div class="d">用量统计、密钥管理与模型路由</div>
            <span class="arrow">打开 →</span>
          </a>
        </div>
      </section>

      <footer>
        <div>maomaokingdom.top</div>
        <div style="margin-top: 6px">
          <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener"
            >浙ICP备2026067766号-1</a
          >
        </div>
      </footer>
    </div>

    <script>
      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent =
          pad(now.getHours()) + ":" + pad(now.getMinutes());
        document.getElementById("seconds").textContent = pad(now.getSeconds());
        document.getElementById("date").textContent = now.toLocaleDateString(
          "zh-CN",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long",
          },
        );
      }
      updateClock();
      setInterval(updateClock, 1000);

      function checkStatus(el) {
        const url = el.dataset.url;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        fetch(url, { mode: "no-cors", signal: ctrl.signal })
          .then(() => {
            el.classList.add("online");
          })
          .catch(() => {
            el.classList.add("offline");
          })
          .finally(() => clearTimeout(timer));
      }
      document.querySelectorAll(".status").forEach(checkStatus);
    </script>
  </body>
</html>
