# LiteLLM 模型路由表（实际部署版）
# 命名三段式：供应商:模型名(协议)，见 docs/DECISIONS.md 决策 8
# 拷贝到服务器 /opt/litellm/config.yaml，key 用环境变量注入（见 .env）

model_list:
  # ═══ DeepSeek ═══  官方价（元/百万 token）：flash 1/2/0.02，pro 3/6/0.025
  - model_name: "DeepSeek:deepseek-v4-flash(openai)"
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      cache_read_input_token_cost: 0.00000002
      cache_creation_input_token_cost: 0.000001
  - model_name: "DeepSeek:deepseek-v4-flash(anthropic)"
    litellm_params:
      model: anthropic/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com/anthropic
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      cache_read_input_token_cost: 0.00000002
      cache_creation_input_token_cost: 0.000001
  - model_name: "DeepSeek:deepseek-v4-pro(openai)"
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.000000025
      cache_creation_input_token_cost: 0.000003
  - model_name: "DeepSeek:deepseek-v4-pro(anthropic)"
    litellm_params:
      model: anthropic/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com/anthropic
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.000000025
      cache_creation_input_token_cost: 0.000003

  # ═══ MiniMax（Coding Plan）═══  官方按量价：M3 2.1/8.4/0.42，M2.7hs 4.2/16.8/0.42
  - model_name: "MiniMax:MiniMax-M3(openai)"
    litellm_params:
      model: minimax/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com/v1 # 必须覆盖，否则默认打国际端点 401
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084
      cache_read_input_token_cost: 0.00000042
      cache_creation_input_token_cost: 0.0000021
  - model_name: "MiniMax:MiniMax-M3(anthropic)"
    litellm_params:
      model: anthropic/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com/anthropic
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.0000021
      output_cost_per_token: 0.0000084
      cache_read_input_token_cost: 0.00000042
      cache_creation_input_token_cost: 0.0000021
  - model_name: "MiniMax:MiniMax-M2.7-highspeed(openai)"
    litellm_params:
      model: minimax/MiniMax-M2.7-highspeed
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com/v1
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.0000042
      output_cost_per_token: 0.0000168
      cache_read_input_token_cost: 0.00000042
      cache_creation_input_token_cost: 0.000002625
  - model_name: "MiniMax:MiniMax-M2.7-highspeed(anthropic)"
    litellm_params:
      model: anthropic/MiniMax-M2.7-highspeed
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com/anthropic
    model_info:
      custom_pricing: true
      input_cost_per_token: 0.0000042
      output_cost_per_token: 0.0000168
      cache_read_input_token_cost: 0.00000042
      cache_creation_input_token_cost: 0.000002625

litellm_settings:
  drop_params: true
general_settings:
  store_model_in_db: True
  database_url: os.environ/DATABASE_URL # PostgreSQL，见 docs/setup.md
