services:
  relaydock:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PANEL_PASSWORD=${PANEL_PASSWORD:-changeme}
      - GATEWAY_MASTER_KEY=${GATEWAY_MASTER_KEY}
    volumes:
      - ./data:/app/data
      - ./gateway/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
